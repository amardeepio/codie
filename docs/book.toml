[book]
title = "codie"
authors = ["Codie contributors"]
description = "Documentation for codie, a spec-driven terminal coding agent written in Rust."
language = "en"
src = "src"

[build]
build-dir = "book"
create-missing = false

[output.html]
default-theme = "light"
preferred-dark-theme = "navy"
git-repository-url = "https://github.com/your-org/codie"
edit-url-template = "https://github.com/your-org/codie/edit/main/docs/src/{path}"
site-url = "/codie/"
no-section-label = true

[output.html.search]
limit-results = 20
use-boolean-and = true

[output.html.playground]
editable = false
