[workspace]
resolver = "3"
members = ["crates/*", "xtask"]
exclude = ["fuzz"]
default-members = ["crates/codie-cli"]

[workspace.package]
version = "0.4.0"
edition = "2024"
rust-version = "1.88"
license = "MIT OR Apache-2.0"
repository = "https://github.com/amardeepio/codie"
homepage = "https://github.com/amardeepio/codie"
authors = ["Codie contributors"]
description = "A fast, extensible, spec-driven coding agent for the terminal."
keywords = ["coding-agent", "llm", "cli", "ai"]
categories = ["command-line-utilities", "development-tools"]

[workspace.dependencies]
# Internal crates
codie-core = { path = "crates/codie-core", version = "0.4.0" }
codie-ai = { path = "crates/codie-ai", version = "0.4.0" }
codie-tools = { path = "crates/codie-tools", version = "0.4.0" }
codie-tui = { path = "crates/codie-tui", version = "0.4.0" }
codie-session = { path = "crates/codie-session", version = "0.4.0" }
codie-prompt = { path = "crates/codie-prompt", version = "0.4.0" }
codie-testkit = { path = "crates/codie-testkit", version = "0.4.0" }
codie-spec-macro = { path = "crates/codie-spec-macro", version = "0.4.0" }

# Runtime
anyhow = "1"
base64 = "0.22"
async-trait = "0.1"
bytes = "1"
clap = { version = "4", features = ["derive", "env", "wrap_help"] }
dotenvy = "0.15"
futures-util = "0.3"
globset = "0.4"
ignore = "0.4"
jsonschema = { version = "0.61", default-features = false }
pulldown-cmark = { version = "0.13", default-features = false }
ratatui = "0.30"
regex = "1"
reqwest = { version = "0.12", default-features = false, features = [
    "rustls-tls",
    "json",
    "stream",
    "gzip",
] }
rpassword = "7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
similar = "2"
thiserror = "2"
tokio = { version = "1", features = [
    "rt-multi-thread",
    "macros",
    "sync",
    "time",
    "process",
    "fs",
    "signal",
    "io-util",
] }
tokio-util = "0.7"
toml = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "json"] }
unicode-segmentation = "1"
unicode-width = "0.2"

# Tooling
proc-macro2 = "1"
quote = "1"
syn = { version = "2", features = ["full"] }
walkdir = "2"

# Testing
assert_cmd = "2"
insta = { version = "1", features = ["json", "yaml"] }
predicates = "3"
proptest = "1"
tempfile = "3"
wiremock = "0.6"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"
unreachable_pub = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
must_use_candidate = "allow"
too_many_arguments = "allow"

[profile.release]
lto = "fat"
codegen-units = 1
strip = "symbols"

[profile.dev]
debug = 1

[profile.dev.package."*"]
opt-level = 1
