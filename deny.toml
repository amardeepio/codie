# cargo-deny configuration for codie.
# https://embarkstudios.github.io/cargo-deny/
#
# Run locally with `cargo deny check`.

[graph]
all-features = true

[advisories]
db-urls = ["https://github.com/rustsec/advisory-db"]
# Vulnerabilities are denied by default (all vulnerability advisories are
# errors). Add advisory IDs here only with a written justification and an
# expiry date in the PR that adds them.
ignore = []
# Keep unmaintained/unsound findings fatal for direct workspace dependencies,
# but do not let an abandoned transitive crate block unrelated work.
unmaintained = "workspace"
unsound = "workspace"

[licenses]
# Permissive licenses compatible with `MIT OR Apache-2.0`.
confidence-threshold = 0.8
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
    "MPL-2.0",
    "CC0-1.0",
    "Unlicense",
]
# No blanket exceptions: add `[[licenses.exceptions]]` entries per crate if a
# transitive dependency genuinely cannot satisfy the allow list.

[bans]
multiple-versions = "warn"
# Wildcard requirements are denied, except for path dependencies, which are
# how workspace-internal crates refer to each other.
wildcards = "deny"
allow-wildcard-paths = true
# Skip the workspace crates themselves when reporting duplicates.
highlight = "all"
workspace-default-features = "allow"
external-default-features = "allow"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
# Git dependencies must be added deliberately, with review.
allow-git = []
