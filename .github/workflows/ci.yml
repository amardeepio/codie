name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Kept as `check` so the existing branch-protection rule keeps working.
  # The only gate is a successful workspace build.
  check:
    name: check
    runs-on: macos-15-intel
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust 1.88
        uses: dtolnay/rust-toolchain@1.88.0

      - name: Cache
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: build

      - name: Build
        run: cargo build --workspace --all-targets
