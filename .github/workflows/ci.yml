name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Kept as `check` so the existing branch-protection rule keeps working.
  # The only gate is a successful workspace build.
  check:
    name: check
    runs-on: macos-15-intel
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust 1.88
        uses: dtolnay/rust-toolchain@1.120.0

      - name: Cache
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: build

      - name: Build
        run: cargo build --workspace --all-targets

  # Linux artifacts ship in releases, so keep a build signal for the platform.
  linux:
    name: linux
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust 1.88
        uses: dtolnay/rust-toolchain@1.120.0

      - name: Cache
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: linux

      - name: Build
        run: cargo build --workspace --all-targets --locked

  # Windows x64 ships as a preview, so keep a build signal for the platform.
  windows:
    name: windows
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust 1.88
        uses: dtolnay/rust-toolchain@1.120.0

      - name: Cache
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: windows

      - name: Build
        run: cargo build --workspace --all-targets --locked

      - name: Check the installer syntax
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          [scriptblock]::Create((Get-Content -Raw install.ps1)) | Out-Null

      - name: Test the PowerShell tool
        run: cargo test -p codie-tools --test powershell
