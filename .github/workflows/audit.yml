name: Security audit

on:
  schedule:
    # Every Monday at 06:17 UTC (off-peak, avoids the top-of-hour fleet spike).
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: audit-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  audit:
    name: cargo audit (macos-14)
    runs-on: macos-14
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      # cargo audit speaks for itself; this job deliberately files no issues.
      # A red run is the notification, and maintainers triage from there.
      - name: Install cargo-audit
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit
      - name: Audit dependencies
        run: cargo audit
